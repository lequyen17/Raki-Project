server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Khi iframe gọi /intro, hướng về phía container Next.js
    location /intro {
        proxy_pass http://raki-page:3000; # BỎ dấu / ở cuối đi nhé
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. QUAN TRỌNG NHẤT: Điều hướng toàn bộ file CSS/JS/Image của Next.js
    location /_next/ {
        proxy_pass http://raki-page:3000; # Không có dấu / ở cuối
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
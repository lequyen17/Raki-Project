<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if is_success %}Thanh toán thành công{% else %}Thanh toán thất bại{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, hsl(210, 30%, 12%), hsl(210, 30%, 18%));
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 2rem 3rem;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .icon.success { color: #4caf50; }
        .icon.failure { color: #f44336; }
        h1 { margin: 0.5rem 0 1rem; font-weight: 600; font-size: 1.8rem; }
        p { margin: 0.5rem 0; line-height: 1.5; }
        .btn {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            background: hsl(200, 70%, 45%);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover { background: hsl(200, 70%, 55%); }
    </style>
</head>
<body>
    <div class="card">
        {% if is_success %}
            <div class="icon success">&#10004;</div>
            <h1>Thanh toán thành công!</h1>
            <p>Bạn đã nạp <strong>{{ coins }} coin</strong> ({{ amount_vnd }} VND).</p>
        {% else %}
            <div class="icon failure">&#10008;</div>
            <h1>Thanh toán không thành công</h1>
            <p>{{ message }}</p>
        {% endif %}
        <a href="/app/wallet" class="btn">Quay lại ví</a>
    </div>
</body>
</html>

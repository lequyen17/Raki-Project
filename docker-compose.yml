services:
  db:
    image: postgres:15-alpine
    container_name: rakiproject-db-1
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rakiproject-redis-1
    expose:
      - "6379"

  mail-service:
    image: 103487/raki-mail-service:v1.0
    build: ./mail_service
    volumes:
    - ./mail_service:/app
    container_name: rakiproject-mail-service-1
    expose:
      - "8000"
    env_file:
      - .env

  chat-db:
    image: postgres:15-alpine
    container_name: rakiproject-chat-db-1
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME}
      POSTGRES_USER: ${CHAT_DB_USER}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

  chat-service:
    image: 103487/raki-chat-service:v1.0
    build: ./chat_service
    volumes:
    - ./chat_service:/app
    container_name: rakiproject-chat-service-1
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
    - chat-db
    - backend
    environment:
      CHAT_DB_NAME: ${CHAT_DB_NAME}
      CHAT_DB_USER: ${CHAT_DB_USER}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
      CHAT_DB_HOST: ${CHAT_DB_HOST}
      CHAT_DB_PORT: ${CHAT_DB_PORT}
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Cloudflare R2 — điền trong .env (xem chat_service/app/core/config.py)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

  payment-service:
    build: ./payment_service
    container_name: payment-service
    expose:
      - "8080"
    volumes:
      - ./payment_service:/app             # Mount toàn bộ thư mục code hiện tại vào /app trong container
      - ~/.m2:/root/.m2 
    depends_on:
      - payment_db   # Giữ lại cache thư viện Maven trên máy thật để tránh container tải lại từ đầu mỗi khi khởi động
    
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"     # AMQP Port cho Spring Boot
      - "15672:15672"   # Web UI Management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  payment_db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    expose:
      - "5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

  notification_db:
    image: postgres:15-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    expose:
      - "5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data




  backend:
    image: 103487/raki-backend:v3.0
    container_name: rakiproject-backend-1
    build: ./raki
    volumes:
    - ./raki:/app
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      RABBITMQ_HOST: rabbitmq
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    command: >
      sh -c "until python -c 'import socket; s = socket.socket(); s.connect((\"db\", 5432))' 2>/dev/null; do 
               echo 'Đang chờ Database khởi động...'; 
               sleep 1; 
             done;
             echo 'Database đã sẵn sàng! Bắt đầu migrate...';
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"

  raki-page:
    image: 103487/raki-page:v1.0
    container_name: rakiproject-raki-page-1
    build:
      context: ./raki-page
    expose:
      - "3000"

  frontend:
    image: 103487/raki-frontend:v4.0
    container_name: rakiproject-frontend-1
    build: ./frontend
    volumes:
    - ./frontend:/app
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - raki-page
      - chat-service

volumes:
  postgres_data:
  chat_postgres_data:
  payment_postgres_data:
  notification_postgres_data:

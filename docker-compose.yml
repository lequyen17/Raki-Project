services:
  db:
    image: postgres:15-alpine
    container_name: rakiproject-db-1
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: 103487/raki-backend:v3.0
    container_name: rakiproject-backend-1
    build: ./raki
    expose:
      - "8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    command: >
      sh -c "until python -c 'import socket; s = socket.socket(); s.connect((\"db\", 5432))' 2>/dev/null; do 
               echo 'Đang chờ Database khởi động...'; 
               sleep 1; 
             done;
             echo 'Database đã sẵn sàng! Bắt đầu migrate...';
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"

  raki-page:
    image: 103487/raki-page:v1.0
    container_name: rakiproject-raki-page-1
    build:
      context: ./raki-page
    expose:
      - "3000"

  frontend:
    image: 103487/raki-frontend:v4.0
    container_name: rakiproject-frontend-1
    build: ./frontend
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - raki-page

volumes:
  postgres_data:

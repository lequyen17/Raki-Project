spring.application.name=notification-service
server.port=8081

spring:
  rabbitmq:
    # Dùng biến môi trường SPRING_RABBITMQ_HOST, mặc định là 'rabbitmq' khi chạy Docker
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raki-page
  namespace: raki
  labels:
    app: raki-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raki-page
  template:
    metadata:
      labels:
        app: raki-page
    spec:
      containers:
        - name: raki-page
          image: 103487/raki-page:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

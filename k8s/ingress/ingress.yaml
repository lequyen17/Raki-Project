apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raki-rewrite-ingress
  namespace: raki
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Dòng này tương đương với dấu '/' ở cuối proxy_pass trong Nginx:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    
    # Cấu hình Timeout & WebSocket
    nginx.ingress.kubernetes.io/websocket-services: "chat-service,notification-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - http:
        paths:
          # 1. Chat WebSocket (Mô phỏng location /api/chat/ws/ -> proxy_pass .../ws/)
          # Request /api/chat/ws/chat/1 -> Gửi tới chat-service: /ws/chat/1
          - path: /api/chat/ws(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: chat-service
                port:
                  number: 8000

          # 2. Chat Service API (Mô phỏng location /api/chat/ -> proxy_pass .../)
          # Request /api/chat/rooms -> Gửi tới chat-service: /rooms
          - path: /api/chat(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: chat-service
                port:
                  number: 8000

          # 3. Payment Service (Mô phỏng location /api/payment/ -> proxy_pass .../)
          # Request /api/payment/checkout -> Gửi tới payment-service: /checkout
          - path: /api/payment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-service
                port:
                  number: 8080

          # 4. Notification Service (Mô phỏng location /api/notifications/ -> proxy_pass .../)
          - path: /api/notifications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 8081

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raki-main-ingress
  namespace: raki
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - http:
        paths:
          # Django Backend API: Giữ nguyên toàn bộ /api/
          # Request /api/token/ -> Gửi nguyên vẹn tới backend:8000/api/token/
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # React Web App
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # NextJS Landing Page
          - path: /
            pathType: Prefix
            backend:
              service:
                name: raki-page
                port:
                  number: 3000